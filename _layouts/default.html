<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="theme-color" content="#faf9f6">
    <title>{{ page.title }} · {{ site.title }}</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="shell">
      <header>
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Card Sharks home">Card Sharks</a>
        <nav aria-label="Main navigation">
          {% for item in site.navigation %}
            <a href="{{ item.url | relative_url }}"{% if page.nav == item.key %} aria-current="page"{% endif %}>{{ item.label | escape }}</a>
          {% endfor %}
        </nav>
      </header>
      <main id="main">
{{ content }}
      </main>
      <footer>
        <a class="footer-brand" href="{{ '/' | relative_url }}">Card Sharks</a>
        <span>Math games for curious minds.</span>
        <span>© 2026 Allison Cohen</span>
      </footer>
    </div>
  </body>
</html>
